<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 Not Found</title>
  <meta name="description" content="Competition Not Found.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">

  <!-- What people see when the link is shared in a DM -->
  <meta property="og:title" content="404">
  <meta property="og:description" content="Competition Not Found.">
  <meta property="og:type" content="website">

  <!-- Empty icon so the browser doesn't go looking for one -->
  <link rel="icon" href="data:,">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0a0a0a;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;   /* older browsers */
      min-height: 100svh;  /* Instagram's browser: the screen minus its toolbars */
      display: grid;
      place-items: center;
      padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left));
      background: #0a0a0a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      text-align: center;
    }

    main { width: 100%; max-width: 640px; }

    .code {
      font-size: clamp(6rem, 34vw, 11.5rem);
      font-weight: 200;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-right: 0.05em; /* balances the tight letter spacing so it sits truly centred */
      font-variant-numeric: tabular-nums;
      animation: settle 1.4s cubic-bezier(.2, .7, .2, 1) both;
    }

    .message {
      margin-top: clamp(14px, 3.5vw, 22px);
      font-size: clamp(1rem, 4.6vw, 1.3rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: #8e8e93;
      animation: rise 1s cubic-bezier(.2, .7, .2, 1) 0.9s both;
    }

    .hint {
      margin-top: clamp(26px, 7vw, 40px);
      font-size: clamp(0.75rem, 3.2vw, 0.85rem);
      letter-spacing: 0.02em;
      color: #545458;
      animation: rise 1s cubic-bezier(.2, .7, .2, 1) 2s both;
    }

    /* Thin blinking caret after the last line */
    .hint::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: 1.05em;
      margin-left: 5px;
      vertical-align: -0.15em;
      background: currentColor;
      animation: blink 1.1s steps(1, end) 3s infinite;
      opacity: 0.8;
    }

    @keyframes settle {
      from { opacity: 0; filter: blur(8px); transform: scale(0.985); }
      to   { opacity: 1; filter: blur(0);   transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes blink {
      0%   { opacity: 0.8; }
      50%  { opacity: 0; }
    }

    /* If someone has animations turned off, show everything straight away */
    @media (prefers-reduced-motion: reduce) {
      .code, .message, .hint, .hint::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="code">404</h1>
    <p class="message">Competition Not Found.</p>
    <p class="hint">maybe try again later.</p>
  </main>
</body>
</html>
